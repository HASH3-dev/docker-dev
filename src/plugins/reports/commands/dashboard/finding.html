<article class="finding">
  <header>
    <span class="severity {{severity}}">{{severity}}</span>
    <strong>{{title}}</strong>
    {{#if locationHtml}}<span class="location">{{{locationHtml}}}</span>{{/if}}
  </header>
  {{#if details.length}}<dl>{{#each details}}<dt>{{key}}</dt><dd>{{{valueHtml}}}</dd>{{/each}}</dl>{{/if}}
  <footer class="card-footer">
    <button class="ignore" type="button" commandfor="ignore-{{id}}" command="show-modal">Ignore</button>
  </footer>
  <dialog id="ignore-{{id}}" class="ignore-dialog">
    <form method="post" action="/ignores" class="ignore-form">
      <input type="hidden" name="id" value="{{id}}">
      <h3>Ignorar achado</h3>
      <label for="comment-{{id}}">Motivo obrigatório</label>
      <input id="comment-{{id}}" name="comment" required maxlength="1000" placeholder="Motivo para ignorar" autofocus>
      <footer><button type="button" commandfor="ignore-{{id}}" command="close">Cancelar</button><button class="ignore" type="submit">Confirmar ignore</button></footer>
    </form>
  </dialog>
</article>
