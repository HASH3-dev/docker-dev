# yaml-language-server: $schema=../../schemas/command.schema.json
schema: docker-dev/command/v1
name: run
usage: "run <command> [arguments...]"
summary: "Run a command inside the development container."
help: |
  Usage: ./.docker-dev/dev.sh run <command> [arguments...]
steps:
  - call:
      function: require_command_arguments
  - call:
      function: start
  - call:
      function: exec_in_dev
      args: [dev, "$@"]
