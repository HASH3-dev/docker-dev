# yaml-language-server: $schema=../../schemas/command.schema.json
schema: docker-dev/command/v1
name: reset
usage: "reset"
summary: "Stop containers and remove the environment volumes."
help: |
  Usage: ./.docker-dev/dev.sh reset
steps:
  - call:
      function: require_no_arguments
  - call:
      function: show_reset_warning
  - call:
      function: compose
      args: [down, --volumes]
