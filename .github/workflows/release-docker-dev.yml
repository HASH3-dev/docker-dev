name: Release docker-dev

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate source
        run: bun run check && bun test

      - name: Build distribution binaries
        run: bun run build:all

      - name: Upload release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ inputs.tag_name }}"
          dist/docker-dev-linux-x64
          dist/docker-dev-linux-arm64
          dist/docker-dev-darwin-x64
          dist/docker-dev-darwin-arm64
          dist/docker-dev-windows-x64.exe
          --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag_name }}" --draft=false
