name: Release docker-dev

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: Package release
        run: scripts/package-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/dist"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --verify-tag --generate-notes

      - name: Attest release archive provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/dist/docker-dev-${{ github.ref_name }}.tar.gz
